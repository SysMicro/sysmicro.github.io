  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Contact<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:relative; overflow:hidden;\">\n      <svg sc-camel-view-box=\"0 0 640 640\" style=\"position:absolute; top:-40px; right:-60px; width:52vw; max-width:640px; height:auto; opacity:0.7; pointer-events:none;\">\n        <g fill=\"none\" stroke=\"#c9906a\" stroke-width=\"1\">\n          <path d=\"M110,90 C170,60 230,140 210,200 C190,260 280,250 320,310\" stroke-opacity=\"0.45\"><\u002Fpath>\n          <path d=\"M320,310 C360,360 320,420 380,460 C430,495 420,540 470,560\" stroke-opacity=\"0.4\"><\u002Fpath>\n          <path d=\"M210,200 C260,190 300,150 360,170 C410,188 440,150 500,160\" stroke-opacity=\"0.3\"><\u002Fpath>\n          <path d=\"M320,310 C380,300 430,330 480,300 C520,278 560,300 590,270\" stroke-opacity=\"0.3\"><\u002Fpath>\n          <path d=\"M110,90 C90,150 140,190 130,250\" stroke-opacity=\"0.25\"><\u002Fpath>\n        <\u002Fg>\n        <g fill=\"#c9906a\">\n          <circle cx=\"110\" cy=\"90\" r=\"5\" opacity=\"0.7\"><\u002Fcircle>\n          <circle cx=\"210\" cy=\"200\" r=\"8\" opacity=\"0.55\"><\u002Fcircle>\n          <circle cx=\"320\" cy=\"310\" r=\"10\" opacity=\"0.6\"><\u002Fcircle>\n          <circle cx=\"380\" cy=\"460\" r=\"6\" opacity=\"0.5\"><\u002Fcircle>\n          <circle cx=\"470\" cy=\"560\" r=\"7\" opacity=\"0.55\"><\u002Fcircle>\n          <circle cx=\"360\" cy=\"170\" r=\"5\" opacity=\"0.4\"><\u002Fcircle>\n          <circle cx=\"500\" cy=\"160\" r=\"4\" opacity=\"0.35\"><\u002Fcircle>\n          <circle cx=\"480\" cy=\"300\" r=\"5\" opacity=\"0.4\"><\u002Fcircle>\n          <circle cx=\"590\" cy=\"270\" r=\"4\" opacity=\"0.35\"><\u002Fcircle>\n          <circle cx=\"130\" cy=\"250\" r=\"4\" opacity=\"0.35\"><\u002Fcircle>\n        <\u002Fg>\n        <g fill=\"none\" stroke=\"#c9906a\" stroke-width=\"1\" stroke-opacity=\"0.15\">\n          <circle cx=\"320\" cy=\"310\" r=\"60\"><\u002Fcircle>\n          <circle cx=\"210\" cy=\"200\" r=\"40\"><\u002Fcircle>\n        <\u002Fg>\n      <\u002Fsvg>\n      <div style=\"position:relative; max-width:1040px; margin:0 auto; padding:120px 32px 100px;\">\n        <div style=\"display:flex; gap:64px; align-items:center; flex-wrap:wrap;\">\n          <div style=\"flex:1 1 480px; min-width:320px;\">\n            <h1 style=\"font-family:'Spectral',serif; font-weight:400; font-size:56px; line-height:1.12; margin:0 0 20px;\">System Microbiome<\u002Fh1>\n            <p style=\"font-size:19px; line-height:1.7; color:#cfcfcf; max-width:600px; margin:0;\">Exploring microbial world in a system perspective.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAbout }}\">\n    <div style=\"max-width:900px; margin:0 auto; padding:120px 32px 100px;\">\n      <div style=\"font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f2f0eb; margin-bottom:16px;\">Bio<\u002Fdiv>\n      <h1 style=\"font-family: 'Spectral',serif; font-weight: 400; font-size: 38px; margin: 0 0 48px\">Kankan Zhao | 赵侃侃<\u002Fh1>\n\n      <div style=\"display:flex; gap:48px; align-items:flex-start; flex-wrap:wrap; margin-bottom:72px;\">\n        <image-slot id=\"about-portrait\" shape=\"circle\" style=\"width:160px; height:160px; flex-shrink:0;\" placeholder=\"Drop a portrait photo\" src=\"https://github.com/SysMicro.png\"><\u002Fimage-slot>\n        <p style=\"font-size:17px; line-height:1.8; color:#cfcfcf; margin:0 0 20px; flex:1 1 480px;\">I am developing Translational Microbial Ecology, a framework for the gap between what microbial communities encode and what they actually translate. Genomic surveys describe potential; the allocation of finite ribosomal capacity is where ecological strategy is expressed. From metaRiboSeq measurements across soil, marine, and host-associated ecosystems, I derived Translational Resource Partitioning (TRP): communities under competition partition translational investment rather than average it, with niche divergence, not richness, dominating the structure — a pattern that motivates linking translational allocation to proteome-constraint theory in quantitative cell physiology. Three lines extend and test it: prophage translational dynamics, allocation strategies under competitive pressure, and competitive exclusion as the framework's engineering test for soil health and pathogen displacement.\n          <br><br>\n          Outside the lab, I'm a longtime fan of progressive rock, post-rock, punk, post-punk, and electronic music — a taste that also feeds into my science communication work, where I convert biological data into electronic music.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f2f0eb; margin-bottom:8px;\">Work Experience<\u002Fdiv>\n      <div style=\"display:flex; gap:32px; padding:28px 0; border-top:1px solid #322f2b; flex-wrap:wrap;\">\n        <div style=\"flex:0 0 160px; font-size:13px; color:#6e6e6e;\">Dec. 2023 – present<\u002Fdiv>\n        <div style=\"flex:1 1 400px;\">\n          <div style=\"font-family:'Spectral',serif; font-size:18px; margin-bottom:6px;\">Postdoctoral Researcher<\u002Fdiv>\n          <div style=\"font-size:14px; color:#aaaaaa;\">University of California San Diego · PI: Prof. Karsten Zengler<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f2f0eb; margin:56px 0 8px;\">Education<\u002Fdiv>\n      <div style=\"display:flex; gap:32px; padding:28px 0; border-top:1px solid #322f2b; flex-wrap:wrap;\">\n        <div style=\"flex:0 0 160px; font-size:13px; color:#6e6e6e;\">Sep. 2017 – Jun. 2023<\u002Fdiv>\n        <div style=\"flex:1 1 400px;\">\n          <div style=\"font-family:'Spectral',serif; font-size:18px; margin-bottom:6px;\">Ph.D. in Soil Science<\u002Fdiv>\n          <div style=\"font-size:14px; color:#aaaaaa;\">Zhejiang University · Supervisors: Prof. Jianming Xu, Prof. Bin Ma<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:32px; padding:28px 0; border-top:1px solid #322f2b; flex-wrap:wrap;\">\n        <div style=\"flex:0 0 160px; font-size:13px; color:#6e6e6e;\">Aug. 2013 – Jun. 2017<\u002Fdiv>\n        <div style=\"flex:1 1 400px;\">\n          <div style=\"font-family:'Spectral',serif; font-size:18px; margin-bottom:6px;\">B.S. in Agricultural Resources and Environment<\u002Fdiv>\n          <div style=\"font-size:14px; color:#aaaaaa;\">Zhejiang University<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isProjects }}\">\n    <div style=\"max-width:1040px; margin:0 auto; padding:100px 32px 100px;\">\n      <div style=\"font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f2f0eb; margin-bottom:16px;\">Research<\u002Fdiv>\n      <h1 style=\"font-family:'Spectral',serif; font-weight:400; font-size:44px; margin:0 0 60px;\">Projects<\u002Fh1>\n\n      <div style=\"font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f2f0eb; margin-bottom:8px;\">Ongoing projects<\u002Fdiv>\n      <sc-for list=\"{{ ongoingProjects }}\" as=\"proj\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex; gap:32px; padding:32px 0; border-top:1px solid #322f2b; flex-wrap:wrap;\">\n          <div style=\"flex:0 0 200px; height:140px; background:#242220; border-radius:4px; overflow:hidden;\">\n            \n            <sc-if value=\"{{ proj.isTrp }}\"><image-slot id=\"proj-trp\" shape=\"rect\" fit=\"cover\" style=\"width:200px; height:140px;\" placeholder=\"Project image\" src=\"73eff060-9263-461c-8abd-56cde893831c\"><\u002Fimage-slot><\u002Fsc-if>\n            <sc-if value=\"{{ proj.isRiboseq }}\"><image-slot id=\"proj-riboseq\" shape=\"rect\" fit=\"cover\" style=\"width:200px; height:140px;\" placeholder=\"Project image\" src=\"5 "none\">\n              <path d=\"M28,20 l3,-5 M28,20 l5,-1\"><\u002Fpath>\n              <path d=\"M170,24 l3,-5 M170,24 l5,-1\"><\u002Fpath>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 420px; min-width:280px;\">\n          <h2 style=\"font-family:'Spectral',serif; font-weight:400; font-size:26px; margin:0 0 14px;\">Protein Control — When Molecular Machinery Loses Control<\u002Fh2>\n          <p style=\"font-size:15px; line-height:1.7; color:#cfcfcf; max-width:560px; margin:0 0 20px;\">An experimental piece that translates the amino-acid frequencies of the E. coli RNA polymerase beta subunit into a post-punk composition in the register of Joy Division, built entirely with the Web Audio API — no samples, no external libraries.<\u002Fp>\n          <a href=\"https://sysmicro.github.io/assets/protein-control.html\" target=\"_blank\" rel=\"noreferrer\" style=\"display:inline-block; font-size:13px; letter-spacing:0.5px; padding:12px 22px; background:#f2f0eb; color:#211f1d; border-radius:2px;\">Launch interactive experience →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPublications }}\">\n    <div style=\"max-width:900px; margin:0 auto; padding:100px 32px 100px;\">\n      <div style=\"font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#f2f0eb; margin-bottom:16px;\">2016 – present<\u002Fdiv>\n      <h1 style=\"font-family:'Spectral',serif; font-weight:400; font-size:44px; margin:0 0 20px;\">Publications<\u002Fh1>\n      <a href=\"https://scholar.google.com/citations?user=5gkbqfcAAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noreferrer\" style=\"display:inline-block; font-size:13px; margin-bottom:44px;\">View full profile on Google Scholar →<\u002Fa>\n\n      <div style=\"display:flex; gap:24px; align-items:center; flex-wrap:wrap; padding-bottom:24px; border-bottom:1px solid #322f2b; margin-bottom:8px;\">\n        <sc-raw-select value=\"{{ yearFi  Arthrobacter nicotianae ZM05 under pH stress\", link:\"https://www.sciencedirect.com/science/article/abs/pii/S0304389420326571\", journalName:\"Journal of Hazardous Materials\", journal:\"Journal of Hazardous Materials 410, 124667\", year:2021, cited:\"40\"},\n{n:6, authors:\"Y Liu, B Ma, W Chen, K Schlaeppi, M Erb, E Stirling, L Hu, E Wang, ...\", title:\"Rhizobium Symbiotic Capacity Shapes Root-Associated Microbiomes in Soybean\", link:\"https://www.frontiersin.org/journals/microbiology/articles/10.3389/fmicb.2021.709012/full\", journalName:\"Frontiers in Microbiology\", journal:\"Frontiers in Microbiology 12\", year:2021, cited:\"40\"},\n{n:5, authors:\"R Xue, K Zhao, X Yu, E Stirling, S Liu, S Ye, B Ma, J Xu\", title:\"Deciphering sample size effect on microbial biogeographic patterns and community assembly processes at centimeter scale\", link:\"https://www.sciencedirect.com/science/article/abs/pii/S0038071721000900\", journalName:\"Soil Biology and Biochemistry\", journal:\"Soil Biology and Biochemistry 156, 108218\", year:2021, cited:\"27\"},\n{n:4, authors:\"X Lv, K Zhao, R Xue, Y Liu, J Xu, B Ma\", title:\"Strengthening insights in microbial ecological networks from theory to applications\", link:\"https://journals.asm.org/doi/full/10.1128/msystems.00124-19\", journalName:\"mSystems\", journal:\"mSystems 4 (3)\", year:2019, cited:\"54*\"},\n{n:3, authors:\"B Ma, K Zhao, X Lv, W Su, Z Dai, JA Gilbert, PC Brookes, K Faust, J Xu\", title:\"Genetic correlation network prediction of forest soil microbial functional organization\", link:\"https://academic.oup.com/ismej/article/12/10/2492/7501442\", journalName:\"The ISME Journal\", journal:\"The ISME Journal 12 (10), 2492-2505\", year:2018, cited:\"100\"},\n{n:2, authors:\"X Lv, K Zhao, H Li, B Ma\", title:\"Niche partition of phenanthrene-degrading bacteria along a Phragmites australis rhizosphere gradient\", link:\"https://link.springer.com/article/10.1007/s00374-018-1287-4\", journalName:\"Biology and Fertility of Soils\", journal:\"Biology and Fertility of Soils 54 (5), 607-616\", year:2018, cited:\"11\"},\n{n:1, authors:\"CY Lai, LL Wen, LD Shi, K Zhao, YQ Wang, X Yang, BE Rittmann, ...\", title:\"Selenate and nitrate bioreductions using methane as the electron donor in a membrane biofilm reactor\", link:\"https://pubs.acs.org/doi/abs/10.1021/acs.est.6b02807\", journalName:\"Environmental science & technology\", journal:\"Environmental science & technology 50 (18), 10179-10186\", year:2016, cited:\"159\"}\n];\n\nfunction splitAuthors(str) {\n  const names = ['Kankan Zhao', 'KK Zhao', 'K Zhao', 'Z Kankan'];\n  const re = new RegExp('(' + names.join('|') + ')');\n  return str.split(re).filter(s => s !== '').map(s => ({\n    text: s,\n    weight: names.includes(s) ? 600 : 400,\n    color: names.includes(s) ? '#f2f0eb' : '#aaaaaa'\n  }));\n}\n\nconst VALID_PAGES = ['home', 'about', 'projects', 'publications', 'pipelines', 'contact'];\n\nclass Component extends DCLogic {\n  state = {\n    page: (VALID_PAGES.includes((typeof window !== 'undefined' ? window.location.hash : '').slice(1)))\n      ? window.location.hash.slice(1) : 'home',\n    pubs: PUBLICATIONS,\n    yearFilter: 'all',\n    journalFilter: 'all'\n  };\n\n  componentDidMount() {\n    this._onHashChange = () => {\n      const h = window.location.hash.slice(1);\n      if (VALID_PAGES.includes(h) && h !== this.state.page) this.setState({ page: h });\n    };\n    window.addEventListener('hashchange', this._onHashChange);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this._onHashChange);\n  }\n\n  setPage(p) {\n    this.setState({ page: p });\n    if (typeof window !== 'undefined') window.location.hash = p;\n  }\n\n  renderVals() {\n    const page = this.state.page;\n    const pubs = this.state.pubs;\n    const active = '#f2f0eb';\n    const inactive = '#6e6e6e';\n\n    const years = Array.from(new Set(pubs.map(p => p.year))).sort((a, b) => b - a);\n    const journals = Array.from(new Set(pubs.map(p => p.journalName))).sort();\n\n    const filteredPubs = pubs.filter(p =>\n      (this.state.yearFilter === 'all' || String(p.year) === String(this.state.yearFilter)) &&\n      (this.state.journalFilter === 'all' || p.journalName === this.state.journalFilter)\n    ).map(p => ({ ...p, noLink: !p.link, authorParts: splitAuthors(p.authors) }));\n\n    const ongoingProjects = [\n      { imgId: 'proj-trp', svg: 'trp', isTrp: true, imgPad: 0, title: 'Translational resource partitioning (TRP)', desc: 'Genomic surveys describe what microbial communities can do, not what they are actually doing right now, and that gap matters because ribosomes are finite: how a community allocates them is where ecological strategy shows up. Using metaRiboSeq, a platform for community-scale ribosome profiling, this project measures translational investment across distinct ecosystems spanning soil, marine, and host-associated systems, finding that communities partition their translational investment along a divergence axis rather than averaging it, with niche divergence, not richness, dominating the structure. This recasts community structure as resource allocation under proteome constraint, linking ecology to quantitative cell physiology, and the same logic extends down to viruses: prophages, viral genomes integrated into bacterial chromosomes, reallocate their own translational resources in step with the surrounding community, showing that the resource allocation framework shaping free living microbes also governs an integrated virus riding along inside them.' },\n      { imgId: 'proj-riboseq', svg: 'riboseq', isRiboseq: true, imgPad: 24, title: 'Cross-system atlas of RiboSeq-validated small proteins', desc: 'Small proteins are among the most systematically overlooked parts of microbial genomes: too short to be reliably annotated, they are routinely discarded by standard gene finding pipelines. This project repurposes existing metagenomic ribosome profiling data to ask which of them are actually being translated. Across different microbiomes, spanning the infant and adult gut, the vaginal tract, tomato rhizosphere, marine water, and soil, it recovers 1.6 million translation supported small ORFs, collapsing into 716,000 protein families. The picture that emerges is one of near total novelty and near total locality: 93% of these families are absent from GMSC, the largest existing small protein catalog, and 91% occur in just a single system. Homology based annotation reaches only a sixth of them, and essentially none of the shortest ones.' },\n      { imgId: 'proj-esbl', svg: 'esbl', isEsbl: true, imgPad: 0, title: 'Leveraging microbial competition to fight intestinal multidrug-resistant infections', desc: 'ESBL-producing Enterobacteriaceae are a critical public health threat, and current treatments rely on antibiotics that only accelerate resistance. This project applies the Microbial Interaction and Niche Determination (MIND) framework to fecal samples from ESBL-colonized patients, combining metagenomics, metatranscriptomics, and metaRiboSeq to identify natural competitors of ESBL-producing E. coli based on translational resource allocation. Classifying gut microbes by translational efficiency identified patient-specific competitors, most consistently Streptococcus, Citrobacter, Enterobacter, and Bifidobacterium, and pointed to substrates, starch and C4-dicarboxylates, that favor these competitors over the pathogen. In vitro validation confirmed both effects and the work is now moving into a small human trial as a competition-based, antibiotic-free intervention.' },\n      { imgId: 'proj-earthworm', svg: 'earthworm', isEarthworm: true, imgPad: 0, title: 'A space odyssey of global earthworm expansion', desc: \"Soil organisms sustain the nutrient cycling and fertility that land life and agriculture depend on, yet almost nothing is known about how their diversity has changed over time. Using earthworms as a sentinel for soil fauna, this project builds machine learning models that predict diversity from land use, population, climate, and soil rather than geographic position, reconstructing global richness, abundance, and biomass at decadal resolution from 1850 and projecting them to 2100 under four socioeconomic pathways. The past century's rise in abundance and biomass came almost entirely from farmland expansion rather than richer soils, a fragile gain since per area densities actually fell as cultivation spread onto marginal land. Looking forward, climate replaces land use as the dominant control: warming raises richness but reduces biomass, pulling the two apart.\" },\n      { imgId: 'proj-circadian', svg: 'circadian', isCircadian: true, imgPad: 0, title: 'Circadian rhythms of microbial community in rice rhizosphere', desc: \"Rice rhizosphere microbial communities keep circadian time, set mainly by light driven daily fluctuations in the plant's environment, but what that rhythm actually does to biogeochemical cycling in the soil around the roots was largely unknown. This project tracked diel changes in rhizosphere bacteria, archaea, and viruses using paired metagenome, metatranscriptome, metabolome, and transcriptome data from greenhouse and field settings. Three mechanisms turned out to regulate these rhythms: the microbes' own circadian clock genes, the daily swings of the external environment, and the daily dynamics of the viruses infecting them, establishing that a circadian lens is essential for understanding rhizosphere assembly, virus host interactions, and ecosystem function.\" }\n    ];\n\n    const archivedProjects = [\n      { imgId: 'proj-virusprevalence', imgPad: 0, title: 'Global prevalence of vertebrate viruses in soils', desc: 'Soil is not usually where public health surveillance looks for vertebrate viruses, but it may be an important blind spot. This project screened 3,049 soil metagenome and 1,441 soil metatranscriptome samples from global datasets against a manually curated database of vertebrate viruses, comparing agricultural and natural soils. Agricultural soils showed consistently higher detection rates and richness of vertebrate viruses, a pattern that points to elevated potential health risks tied to farming activity, offering a new One Health angle on agricultural expansion and intensification.' }\n    ];\n\n    const posts = [\n      { date: 'December 15, 2021', title: 'Metagenomics pipeline', desc: 'A step-by-step, assembly-based pipeline for metagenomic analysis of environmental samples, from quality control through virus prediction.', link: 'https://sysmicro.github.io/posts' }\n    ];\n\n    return {\n      isHome: page === 'home', isAbout: page === 'about', isProjects: page === 'projects', isPublications: page === 'publications',\n      isPipelines: page === 'pipelines', isContact: page === 'contact',\n      homeColor: page === 'home' ? active : inactive,\n      aboutColor: page === 'about' ? active : inactive,\n      projectsColor: page === 'projects' ? active : inactive,\n      publicationsColor: page === 'publications' ? active : inactive,\n      pipelinesColor: page === 'pipelines' ? active : inactive,\n      contactColor: page === 'contact' ? active : inactive,\n      navHome: e => { e.preventDefault(); this.setPage('home'); },\n      navAbout: e => { e.preventDefault(); this.setPage('about'); },\n      navProjects: e => { e.preventDefault(); this.setPage('projects'); },\n      navPublications: e => { e.preventDefault(); this.setPage('publications'); },\n      navPipelines: e => { e.preventDefault(); this.setPage('pipelines'); },\n      navContact: e => { e.preventDefault(); this.setPage('contact'); },\n      goHome: () => this.setPage('home'),\n      ongoingProjects, archivedProjects, posts,\n      years, journals,\n      yearFilter: this.state.yearFilter,\n      journalFilter: this.state.journalFilter,\n      setYearFilter: e => this.setState({ yearFilter: e.target.value }),\n      setJournalFilter: e => this.setState({ journalFilter: e.target.value }),\n      filteredPubs, resultCount: filteredPubs.length, totalCount: pubs.length,\n      year: new Date().getFullYear()\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
